name: Run Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite:///./ci.db
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      REGISTERED_JOB_TYPES: generate_report,send_email

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx python-dotenv

      - name: Run unit tests
        run: pytest -m "not integration and not e2e" -v

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    # Avoid simultaneous drain/cancellation tests
    # against the same environment.
    concurrency:
      group: e2e-staging
      cancel-in-progress: false

    env:
      E2E_API_URL: ${{ vars.E2E_API_URL }}
      DATABASE_URL: ${{vars.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx python-dotenv

      - name: Verify E2E configuration
        run: |
          if [ -z "$E2E_API_URL" ]; then
            echo "E2E_API_URL is not configured"
            exit 1
          fi
          echo "E2E API URL: $E2E_API_URL"

      - name: Wait for API to become healthy
        run: |
          curl --fail \
            --retry 12 \
            --retry-delay 5 \
            --retry-connrefused \
            "$E2E_API_URL/health"

      - name: Run E2E tests
        run: |
          pytest tests/test_end_to_end.py -m e2e -v
